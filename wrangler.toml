name = "content-production"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "content-os-db"
database_id = "25b209b2-1213-44c5-8b5f-1726001a3443"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "e9050d4f59524e32a0b783a4b1a95384"

# R2 bucket for thumbnail images and other media assets.
# Binding name `MEDIA` is what the Worker code uses (e.g. env.MEDIA).
# bucket_name is the actual R2 bucket; rename to match the bucket you create
# in the Cloudflare dashboard (or via `wrangler r2 bucket create`).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "content-os-media"

# Scheduled triggers.
# 0 9 * * *   — 09:00 UTC daily: the morning content brief.
# 0 */3 * * * — every 3 hours: competitor viral check.
[[triggers]]
crons = ["0 9 * * *", "0 */3 * * *"]

# Workers AI binding for image generation and other AI tasks.
# Access in code as `env.AI` (e.g. env.AI.run("@cf/black-forest-labs/flux-1-schnell", { prompt })).
[ai]
binding = "AI"